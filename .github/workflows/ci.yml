# CI for NAS-tools.
#
# Path dependencies live *outside* this repository:
#   crates/nas-transfer → ../../../simple-network
#   crates/nas-crypto   → ../../../rust-secure-memory/crates/secure-memory
# so the checkout layout is work/{NAS-tools,simple-network,rust-secure-memory}.
#
# If those siblings are private, set repository secret SIBLING_PAT to a token
# that can read them. github.token only covers this repo.
#
# linux arm64 is a *compile* job (docker/build.sh), not a substitute for ci.sh.
# uc11 (container drill) stays manual: run.sh skips scripts without uc_summary.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: ci.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: work/NAS-tools
    steps:
      - name: Checkout NAS-tools
        uses: actions/checkout@v4
        with:
          path: work/NAS-tools

      - name: Checkout simple-network
        uses: actions/checkout@v4
        with:
          repository: zeta1999/simple-network
          path: work/simple-network
          token: ${{ secrets.SIBLING_PAT || github.token }}

      - name: Checkout rust-secure-memory
        uses: actions/checkout@v4
        with:
          repository: zeta1999/rust-secure-memory
          path: work/rust-secure-memory
          token: ${{ secrets.SIBLING_PAT || github.token }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Java (TLC)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Lean 4.28 (elan; no lake — NasVerify is standalone .lean)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run ci.sh (CI_MILESTONE defaults to M6)
        run: ./ci.sh

  # Static musl `nas` for the container image. This compiles; it does not run
  # the acceptance suite. ci.sh above is the gate.
  musl:
    name: musl nas (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Compile-only. Not a substitute for ci.sh. Uses the arm runner when
          # the org has ubuntu-24.04-arm; otherwise this job is the documented
          # arm64 compile path via docker/build.sh ARCH=arm64.
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: work/NAS-tools
    steps:
      - name: Checkout NAS-tools
        uses: actions/checkout@v4
        with:
          path: work/NAS-tools

      - name: Checkout simple-network
        uses: actions/checkout@v4
        with:
          repository: zeta1999/simple-network
          path: work/simple-network
          token: ${{ secrets.SIBLING_PAT || github.token }}

      - name: Checkout rust-secure-memory
        uses: actions/checkout@v4
        with:
          repository: zeta1999/rust-secure-memory
          path: work/rust-secure-memory
          token: ${{ secrets.SIBLING_PAT || github.token }}

      - name: Compile static musl nas (not ci.sh)
        env:
          ARCH: ${{ matrix.arch }}
        run: ./docker/build.sh
