[package]
name = "nas-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "nas"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
nas-core = { path = "../nas-core" }
nas-crypto = { path = "../nas-crypto" }
nas-delete = { path = "../nas-delete" }
nas-lease = { path = "../nas-lease" }
nas-peer = { path = "../nas-peer" }
nas-slots = { path = "../nas-slots" }
nas-store = { path = "../nas-store" }
nas-transfer = { path = "../nas-transfer" }
nas-vault = { path = "../nas-vault" }
# Direct, not incidental: turning terminal echo off for the passphrase prompt
# is a tcgetattr/tcsetattr pair and nothing else. A crate whose whole job is
# reading a password would be a bigger dependency for a smaller reason.
libc = "0.2"
zeroize = "1"
