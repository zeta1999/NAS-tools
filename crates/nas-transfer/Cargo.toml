[package]
name = "nas-transfer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = { workspace = true }
nas-core = { path = "../nas-core" }
nas-crypto = { path = "../nas-crypto" }
nas-peer = { path = "../nas-peer" }
nas-slots = { path = "../nas-slots" }
nas-store = { path = "../nas-store" }
simple_network = { path = "../../../simple-network", default-features = false, features = ["pqc"] }
# Already in the tree via simple_network's `pqc` feature; used only to peek at
# the client's verifying key inside its hello (see `Channel::accept_from`).
serde_json = "1"

[dev-dependencies]
proptest = "1"
