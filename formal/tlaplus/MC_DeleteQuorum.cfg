\* Deep gate (DEEP=1). What it deepens is the ADVERSARY, not the clock.
\*
\* MaxSlots 4 is a bundle big enough to carry a full escalated quorum of three
\* AND a fourth record. The CI gate's three slots leave no room to pad a
\* legitimate quorum with a replayed or re-targeted approval; here there is
\* room, and roughly eight times as many bundles are tried at every state.
\*
\* Everything else is held at the CI gate's values on purpose, so the two runs
\* are comparable: if the padding bought the executor anything, the reachable
\* state count would move. It does not.
\*
\* Deepening the clock instead (MaxTime 4) or the authority (Roster 4) both
\* run past twenty minutes; see formal/README.md for what they reached.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Roster              = {m1, m2, m3}
    Outsiders           = {x1}
    Requests            = {r1, r2}
    SmallScope          = {r1}
    QuorumSmall         = 1
    QuorumWide          = 2
    EscalateTo          = 3
    RollingLimit        = 1
    CoolOff             = 2
    MaxTime             = 3
    MaxSlots            = 4
    StrictApprovalCheck = TRUE
    StrictAuthority     = TRUE
    EnforceCoolOff      = TRUE
INVARIANTS
    TypeOK
    NoExecutionWithoutQuorum
    NoReplayCountsTwice
    NoEarlyApproval
    NoEarlyExecution
    TrailComplete
PROPERTIES
    TrailMonotonic
