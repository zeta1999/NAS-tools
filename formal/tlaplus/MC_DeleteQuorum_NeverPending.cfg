\* SANITY -- MUST FAIL. There must be reachable states in which an authority
\* member has been handed the request but its cooling-off has not yet elapsed.
\* That window is the only place back-dating could ever pay; if it were empty,
\* NoEarlyApproval would be true for want of anything to be true about.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Roster              = {m1, m2, m3}
    Outsiders           = {x1}
    Requests            = {r1, r2}
    SmallScope          = {r1}
    QuorumSmall         = 1
    QuorumWide          = 2
    EscalateTo          = 3
    RollingLimit        = 1
    CoolOff             = 2
    MaxTime             = 3
    MaxSlots            = 3
    StrictApprovalCheck = TRUE
    StrictAuthority     = TRUE
    EnforceCoolOff      = TRUE
INVARIANT NeverPending
