\* SANITY -- MUST FAIL. A full escalated quorum of distinct authority
\* members must be reachable on one request, or the quorum rule is never met.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Roster              = {m1, m2, m3}
    Outsiders           = {x1}
    Requests            = {r1, r2}
    SmallScope          = {r1}
    QuorumSmall         = 1
    QuorumWide          = 2
    EscalateTo          = 3
    RollingLimit        = 1
    CoolOff             = 2
    MaxTime             = 3
    MaxSlots            = 3
    StrictApprovalCheck = TRUE
    StrictAuthority     = TRUE
    EnforceCoolOff      = TRUE
INVARIANT NeverReachesQuorum
