\* SANITY -- MUST FAIL. NEGATIVE CONTROL for the cooling-off, and the honest
\* statement of its limit.
\*
\* EnforceCoolOff = FALSE is an approver device that signs whatever it is
\* handed -- the relay's back-dated `first_seen` believed instead of the
\* device's own stamp. TLC must then find a full quorum delivered at tick 0 and
\* a deletion executing on it.
\*
\* That counterexample IS SPECS §16.2: "cooling-off is enforced by the approver
\* devices, against their own local clocks... nothing in the protocol can
\* enforce it." NoEarlyExecution is a claim about honest approver devices, and
\* this configuration is what it looks like when one of them is not.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Roster              = {m1, m2, m3}
    Outsiders           = {x1}
    Requests            = {r1, r2}
    SmallScope          = {r1}
    QuorumSmall         = 1
    QuorumWide          = 2
    EscalateTo          = 3
    RollingLimit        = 1
    CoolOff             = 2
    MaxTime             = 3
    MaxSlots            = 3
    StrictApprovalCheck = TRUE
    StrictAuthority     = TRUE
    EnforceCoolOff      = FALSE
INVARIANT NoEarlyExecution
