\* SANITY -- MUST FAIL. NEGATIVE CONTROL for the authority check, and the one
\* that models a defect that was really shipped: STATUS.md records that
\* `decide` once counted *distinct approvers* and stopped there.
\*
\* StrictAuthority = FALSE is that version. `Outsiders` are keypairs the
\* compromised laptop minted -- valid signatures, genuinely distinct approvers,
\* simply not in the offline authority. TLC must find an execution they carry,
\* which is §16.1's central claim ("ransomware on the laptop cannot delete,
\* because the authority is not there to steal") failing.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Roster              = {m1, m2, m3}
    Outsiders           = {x1, x2}
    Requests            = {r1, r2}
    SmallScope          = {r1}
    QuorumSmall         = 1
    QuorumWide          = 2
    EscalateTo          = 3
    RollingLimit        = 1
    CoolOff             = 2
    MaxTime             = 3
    MaxSlots            = 3
    StrictApprovalCheck = TRUE
    StrictAuthority     = FALSE
    EnforceCoolOff      = TRUE
INVARIANT NoExecutionWithoutQuorum
