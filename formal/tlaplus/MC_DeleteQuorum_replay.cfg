\* SANITY -- MUST FAIL. NEGATIVE CONTROL for the replay defence.
\*
\* StrictApprovalCheck = FALSE removes the two lines that stop it: the
\* `request_hash` binding `DeleteExecution::verify` enforces, and the
\* `BTreeSet` by approver id that `decide` counts through. The verifier then
\* counts the records it was handed. TLC must find an execution whose count
\* exceeds the number of authority members who actually signed that request --
\* the same record twice, or one lifted from the other request.
\*
\* If this ever PASSES, NoReplayCountsTwice is being carried by something other
\* than the check it is supposed to be about, and the green run is a lie.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Roster              = {m1, m2, m3}
    Outsiders           = {x1}
    Requests            = {r1, r2}
    SmallScope          = {r1}
    QuorumSmall         = 1
    QuorumWide          = 2
    EscalateTo          = 3
    RollingLimit        = 1
    CoolOff             = 2
    MaxTime             = 3
    MaxSlots            = 3
    StrictApprovalCheck = FALSE
    StrictAuthority     = TRUE
    EnforceCoolOff      = TRUE
INVARIANT NoReplayCountsTwice
