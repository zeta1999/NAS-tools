\* CI gate: 3 authority members, 1 minted key, 2 requests, cooling-off 2 ticks.
\* Every action in this model strictly grows the trail, so the saturated state
\* has no successor at all; that is a bound, not a bug, hence CHECK_DEADLOCK.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Roster              = {m1, m2, m3}
    Outsiders           = {x1}
    Requests            = {r1, r2}
    SmallScope          = {r1}
    QuorumSmall         = 1
    QuorumWide          = 2
    EscalateTo          = 3
    RollingLimit        = 1
    CoolOff             = 2
    MaxTime             = 3
    MaxSlots            = 3
    StrictApprovalCheck = TRUE
    StrictAuthority     = TRUE
    EnforceCoolOff      = TRUE
INVARIANTS
    TypeOK
    NoExecutionWithoutQuorum
    NoReplayCountsTwice
    NoEarlyApproval
    NoEarlyExecution
    TrailComplete
PROPERTIES
    TrailMonotonic
